apiVersion: apps/v1
kind: Deployment
metadata:
  name: authms-deployment
  namespace: blog-application
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-app
  template:
    metadata:
      labels:
        app: blog-app
    spec:
      containers:
        - name: authms-container
          image: medhakommana/auth930:latest-436ee23
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: authms-secret

